name: CI

on:
  push:
    branches: [master, release]
  pull_request:
    branches: [master, release]

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Same environment as quickview-env.yml, with the Python version from the matrix
      - name: Pin Python version in the conda environment
        run: |
          sed -E 's/^([[:space:]]*-[[:space:]]*python)=.*/\1=${{ matrix.python-version }}/' \
            quickview-env.yml > ci-env.yml
          grep -E '^[[:space:]]*-[[:space:]]*python=' ci-env.yml

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          activate-environment: quickview
          environment-file: ci-env.yml
          channel-priority: strict

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
        shell: bash -l {0}

      - name: Run help command
        run: |
          python -m e3sm_quickview.app --help
        shell: bash -l {0}

      - name: Run tests
        run: |
          xvfb-run -a python -m pytest
        shell: bash -l {0}

  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit hooks
        run: |
          python -m pip install --upgrade pip pre-commit
          pre-commit run --all-files --show-diff-on-failure --color=always
